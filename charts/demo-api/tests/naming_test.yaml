# Names, labels, and the Secret indirection.
#
# The selector-label assertions are the most valuable in the whole suite. A Deployment's
# spec.selector is immutable after install: if a version-dependent label ever leaks into
# it, the chart becomes un-upgradeable and the only fix is uninstall/reinstall. That is
# a bug you want caught by a test, not by a release.
suite: naming and identity
chart:
  version: 0.1.0
  appVersion: "0.1.0"
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secret.yaml
  - templates/service.yaml

tests:
  - it: keeps version-dependent labels out of the immutable selector
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/version"]
      - notExists:
          path: spec.selector.matchLabels["helm.sh/chart"]
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: demo-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: keeps the Service selector equally version-free
    template: templates/service.yaml
    asserts:
      - notExists:
          path: spec.selector["app.kubernetes.io/version"]
      - notExists:
          path: spec.selector["helm.sh/chart"]

  - it: carries the full recommended label set on the objects themselves
    template: templates/service.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "0.1.0"
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: demo-api-0.1.0

  - it: does not stutter when the release is named after the chart
    template: templates/service.yaml
    release:
      name: demo-api
    asserts:
      - equal:
          path: metadata.name
          value: demo-api

  - it: honours fullnameOverride
    template: templates/service.yaml
    set:
      fullnameOverride: api
    asserts:
      - equal:
          path: metadata.name
          value: api

  - it: falls back to the chart appVersion for the image tag
    # This is the whole reason Chart.yaml carries two versions: shipping a new app
    # build is an appVersion bump and nothing else.
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: k3d-registry:5000/demo-api:0.1.0
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "0.1.0"

  - it: lets an explicit tag win over appVersion
    template: templates/deployment.yaml
    set:
      image.tag: "0.2.0-rc1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: k3d-registry:5000/demo-api:0.2.0-rc1

  - it: mounts an externally-managed Secret without touching a template
    # The production shape. Everything that consumes the Secret goes through one
    # helper, so this is a values decision and not a chart fork.
    template: templates/deployment.yaml
    set:
      secret.create: false
      secret.existingSecret: demo-api-token-from-vault
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: demo-api-token-from-vault

  - it: tells the app where the token is mounted
    template: templates/deployment.yaml
    set:
      secret.mountPath: /var/run/creds
      secret.key: api-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_PATH
            value: /var/run/creds/api-key

  - it: refuses to run with neither a templated nor an existing Secret
    # A `fail` from _helpers.tpl, not a schema rule: the constraint is a relationship
    # between two keys with legal values, which is where template validation earns its
    # keep.
    template: templates/deployment.yaml
    set:
      secret.create: false
    asserts:
      - failedTemplate:
          errorPattern: "secret.create is false but secret.existingSecret is empty"

  - it: refuses to template a Secret and mount a different one
    template: templates/deployment.yaml
    set:
      secret.existingSecret: some-other-secret
    asserts:
      - failedTemplate:
          errorPattern: "secret.create is true and secret.existingSecret is set"

  - it: puts config in the ConfigMap as strings, whatever type it arrived as
    # A ConfigMap holds strings and nothing else. An unquoted `WARMUP_SECONDS: 5` is a
    # YAML integer the API server rejects outright.
    template: templates/configmap.yaml
    set:
      config.warmupSeconds: 12
      config.extraEnv:
        FEATURE_FLAG: true
        RETRY_COUNT: 3
    asserts:
      - equal:
          path: data.WARMUP_SECONDS
          value: "12"
      - equal:
          path: data.FEATURE_FLAG
          value: "true"
      - equal:
          path: data.RETRY_COUNT
          value: "3"

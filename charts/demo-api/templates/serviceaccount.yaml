{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "demo-api.serviceAccountName" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app makes no Kubernetes API calls, so it gets a ServiceAccount of its own with
# no RoleBinding and no mounted token. A dedicated identity with zero permissions is
# still worth having: it keeps the workload out of the `default` ServiceAccount, which
# other things in the namespace may later be granted access through.
#
# This is also set on the pod spec, which is the one that actually governs the
# projected volume when the two disagree.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

{{- if .Values.podDisruptionBudget.enabled }}
# A PodDisruptionBudget constrains *voluntary* disruption only — `kubectl drain`, the
# eviction API, a cluster autoscaler removing a node. It does nothing about a node
# that dies, and it is not a substitute for replicas.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  # Expressed as maxUnavailable rather than minAvailable so it stays satisfiable when
  # the HPA moves the replica count. The interaction with the Deployment's rollout is
  # the thing worth understanding:
  #
  #   strategy.maxUnavailable: 0  — the *rollout* never voluntarily removes a ready
  #                                 pod before its replacement is ready.
  #   pdb.maxUnavailable: 1       — a *drain* may take one pod at a time.
  #
  # Tighten the PDB to 0 and every drain blocks forever: the eviction API refuses,
  # there is no surge capacity to create a replacement first, and the node never
  # empties. A PDB stricter than the deployment's surge capacity is a deadlock, not
  # extra safety.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "demo-api.selectorLabels" . | nindent 6 }}
{{- end }}

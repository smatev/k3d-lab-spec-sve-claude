{{- if .Values.secret.create }}
# LOCAL DEVELOPMENT ONLY.
#
# The value comes from values.yaml, which means it is in git, in `helm get values`, in
# CI logs, and in every ci/ fixture. That is acceptable for a token this lab invents
# for itself and unacceptable for anything else.
#
# The production shape is already here and needs no template change:
#
#   secret:
#     create: false
#     existingSecret: demo-api-token   # managed by External Secrets, SOPS, sealed-secrets...
#     key: token
#
# Everything that consumes the Secret goes through the demo-api.secretName helper, so
# switching between the two is purely a values decision.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
type: Opaque
# stringData rather than data: Helm would happily let us write `data:` with a
# b64enc'd value, but base64 is encoding, not encryption, and spelling it out invites
# the reader to believe otherwise.
stringData:
  {{ .Values.secret.key }}: {{ .Values.secret.value | quote }}
{{- end }}

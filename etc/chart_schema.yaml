# Yamale schema for Chart.yaml, used by `ct lint`.
#
# chart-testing ships this file inside its Docker image at /etc/ct. We install ct as a
# plain binary from .tool-versions, so nothing is at /etc/ct and ct refuses to start
# without it — hence a vendored copy here, pointed at by ct.yaml.
#
# It is upstream's schema with the fields this repo actually cares about made
# mandatory: `home`, `sources` and `maintainers` are required so a chart cannot be
# published with no idea where it came from, and `kubeVersion` is required because a
# chart that renders Gateway API v1 and autoscaling/v2 must say so.

name: str()
home: str()
version: str()
apiVersion: str()
appVersion: any(str(), num())
description: str()
kubeVersion: str()
keywords: list(str(), required=False)
sources: list(str())
maintainers: list(include('maintainer'))
dependencies: list(include('dependency'), required=False)
icon: str(required=False)
engine: str(required=False)
condition: str(required=False)
tags: str(required=False)
deprecated: bool(required=False)
annotations: map(str(), str(), required=False)
type: str(required=False)

---
maintainer:
  name: str()
  email: str(required=False)
  url: str(required=False)

dependency:
  name: str()
  version: str()
  repository: str()
  condition: str(required=False)
  tags: list(str(), required=False)
  enabled: bool(required=False)
  import-values: any(list(str()), list(include('import-value')), required=False)
  alias: str(required=False)

import-value:
  child: str()
  parent: str()
